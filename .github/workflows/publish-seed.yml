name: Publish a CI seed

# Turns the artifacts of a seed build into the seed every later CI run reads.
#
# The binaries go to an immutable release named by the caller
# (seed-<run id>). The pointer is a separate floating release, ci-seed, that
# holds nothing but MANIFEST.json. GitHub cannot overwrite a release asset in
# place, so promotion recreates ci-seed; because the binaries are published
# first and never rewritten, the new manifest can never name a file that is
# not there yet.
#
# Two callers, differing only in whose artifacts they mean. Called from
# build-toolchain.yml it reads this run's own artifacts, which is why that path
# has to build and test before it can publish. Dispatched with `source-run` it
# reads the artifacts of a run that already happened and already passed, so
# promoting a green generation costs the publish alone, not another full build -
# at the price that the suites being green is something this run verifies by
# that run's conclusion rather than by watching it.
#
# Nothing here is configured: the asset URLs live in the manifest, and the
# manifest URL is derived from github.repository.

on:
  workflow_call:
    inputs:
      generation:
        description: 'release tag that will hold this generation'
        type: string
        required: true
      commit:
        description: 'commit the seed was built from'
        type: string
        required: true
      keep:
        description: 'how many past generations to keep'
        type: string
        required: false
        default: '5'
      source-run:
        description: 'run whose artifacts become the seed; empty means this run'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      source-run:
        description: 'id of the green toolchain run to publish'
        type: string
        required: true
      keep:
        description: 'how many past generations to keep'
        type: string
        required: false
        default: '5'

permissions:
  contents: write
  actions: read

# Two promotions must not interleave: the second could recreate ci-seed while
# the first is still uploading.
concurrency:
  group: ci-seed-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Resolve which generation is being published
      id: resolve
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CALL_GENERATION: ${{ inputs.generation }}
        CALL_COMMIT: ${{ inputs.commit }}
        SOURCE_RUN: ${{ inputs.source-run }}
        CURRENT_RUN: ${{ github.run_id }}
      run: |
        set -euo pipefail
        # Not github.event_name: a called workflow inherits the caller's event,
        # so a dispatched build-toolchain run would look like a dispatched
        # publish here. The caller always names a generation; the human always
        # names a run.
        if [ -n "$CALL_GENERATION" ]; then
          echo "generation=$CALL_GENERATION" >> "$GITHUB_OUTPUT"
          echo "commit=$CALL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "run-id=$CURRENT_RUN" >> "$GITHUB_OUTPUT"
        elif [ -n "$SOURCE_RUN" ]; then
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" \
            --jq '"name=\(.name)\nconclusion=\(.conclusion)\ncommit=\(.head_sha)\n"' > run.txt
          cat run.txt
          # A seed is the bootstrap every later build starts from, so the run
          # being pointed at has to have concluded green; the artifact guard
          # below catches a run that never built a toolchain at all.
          grep -q '^conclusion=success$' run.txt || {
            echo "run $SOURCE_RUN is not green; nothing to promote" >&2
            exit 1
          }
          echo "generation=seed-$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' run.txt)" >> "$GITHUB_OUTPUT"
          echo "run-id=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
        else
          echo "no generation and no source-run: nothing to publish" >&2
          exit 1
        fi

    - name: Audit seed tooling
      run: |
        set -euo pipefail
        python3 -m unittest discover -s tools/ci -p "test_*.py"

    - name: Download seed artifacts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RUN_ID: ${{ steps.resolve.outputs.run-id }}
      run: |
        set -euo pipefail
        # Not actions/download-artifact, whose github-token input is what makes a
        # run other than the current one legible: without it the action listed
        # zero artifacts and still reported success, so the empty seed travelled
        # all the way to the manifest step (run 37117305098). gh queries the REST
        # API with this job's token, which the resolve step above already used on
        # a foreign run, and a pattern matching nothing is an error there.
        gh run download "$RUN_ID" --pattern 'seed-*' --dir build/seed/artifacts
        ls -1 build/seed/artifacts

    - name: Assemble the seed manifest
      env:
        GENERATION: ${{ steps.resolve.outputs.generation }}
        COMMIT: ${{ steps.resolve.outputs.commit }}
      run: |
        set -euo pipefail
        python3 tools/ci/seed-manifest.py \
          --seeds build/seed/artifacts \
          --stage build/seed/assets \
          --generation "$GENERATION" \
          --commit "$COMMIT" \
          --out build/seed/MANIFEST.json
        cat build/seed/MANIFEST.json >> "$GITHUB_STEP_SUMMARY"

    - name: Publish the generation release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GENERATION: ${{ steps.resolve.outputs.generation }}
        COMMIT: ${{ steps.resolve.outputs.commit }}
      run: |
        set -euo pipefail
        mapfile -d '' files < <(find build/seed/assets -type f -print0 | sort -z)
        test "${#files[@]}" -gt 0
        gh release create "$GENERATION" \
          --target "$COMMIT" \
          --title "$GENERATION" \
          --notes "CI seed generation built from $COMMIT." \
          "${files[@]}"

    - name: Point ci-seed at this generation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GENERATION: ${{ steps.resolve.outputs.generation }}
        COMMIT: ${{ steps.resolve.outputs.commit }}
      run: |
        set -euo pipefail
        gh release delete ci-seed --yes 2>/dev/null || true
        gh release create ci-seed \
          --target "$COMMIT" \
          --title "CI seed" \
          --notes "Current CI seed: $GENERATION, built from $COMMIT." \
          build/seed/MANIFEST.json

    - name: Prune old generations
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KEEP: ${{ inputs.keep }}
      run: |
        set -euo pipefail
        # Written to a file first: a heredoc and a pipe would both be stdin.
        gh release list --limit 200 --json tagName,createdAt > build/seed/releases.json
        python3 - "$KEEP" build/seed/releases.json > build/seed/prune.txt <<'PY'
        import json, sys

        keep = int(sys.argv[1])
        with open(sys.argv[2]) as handle:
            releases = json.load(handle)
        generations = sorted(
            (item for item in releases if item["tagName"].startswith("seed-")),
            key=lambda item: item["createdAt"],
            reverse=True,
        )
        for release in generations[keep:]:
            print(release["tagName"])
        PY
        while read -r tag; do
          test -n "$tag" || continue
          echo "pruning $tag"
          gh release delete "$tag" --yes
        done < build/seed/prune.txt
