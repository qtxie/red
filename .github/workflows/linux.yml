name: Linux-x86-64

on: [push, pull_request]

permissions:
  contents: read
  actions: write

env:
  RED_TARGET: Linux-X86-64
  RED_SYSTEM_TARGET: Linux-X86-64

jobs:
  Linux-X64-All:
    # Blocked: there is no Linux toolchain. build-red-toolchain.red has a
    # source for Windows-X86-64 and Darwin-ARM64 only, so no Linux seed can be
    # built and the suites have no compiler to compile their tests with.
    # Re-enable once a Linux toolchain source exists; Linux binaries today are
    # cross-compiled from Windows and shipped to a Linux box to run.
    if: false
    runs-on: ubuntu-24.04
    name: Run Linux x86-64 Tests
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Linux x86-64 test dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils ca-certificates curl file gawk gcc libc6:i386 libc6-dev \
          libcurl4t64 libgtk-3-0t64

    - uses: ./.github/actions/setup-red-harness
      with:
        platform: linux-x64

    - name: run every Red suite
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain
        RED_COMPILER_ARGUMENTS: -t Linux-X86-64
        RED_SYSTEM_COMPILER: build/toolchain/bin/red-toolchain
        RED_SYSTEM_COMPILER_ARGUMENTS: -t Linux-X86-64
      run: |
        set -euo pipefail
        failed=0
        for runner in \
          tools/self_hosting/run-red-unit-tests.red \
          tools/self_hosting/run-red-system-tests.red \
          tools/self_hosting/run-red-system-compiler-tests.red \
          tools/self_hosting/run-red-compiler-tests.red \
          tools/self_hosting/run-red-view-headless-tests.red
        do
          if ! build/toolchain/red-console "$runner"; then
            echo "::error::$runner failed"
            failed=1
          fi
        done
        exit "$failed"

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Linux-x64-all-test-logs
        if-no-files-found: ignore
        path: |
          build/self-hosting/**
