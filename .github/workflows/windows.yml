name: Windows

# The Windows suites. build-toolchain.yml calls this after the `build` job of
# that run, so the toolchain the suites compile with is the one built from the
# same sources they test. A run that built no toolchain has nothing to test
# with, which is why there is no push trigger here.
#
# A manual run is the convenience path, not the gate: a dispatched run builds
# nothing either, so it takes one published seed generation instead. That is
# what the `source` fallback in each job below says -- a caller passes `build`,
# a human passes nothing and gets `seed`.

on:
  workflow_call:
    inputs:
      source:
        description: 'toolchain to test with: build (this run) | seed (a published generation)'
        type: string
        required: false
        default: build
  workflow_dispatch:
    inputs:
      seed-tag:
        description: 'release that holds MANIFEST.json'
        type: string
        required: false
        default: ci-seed

permissions:
  contents: read
  actions: write

# The suites are driven by Red runners, so nothing here needs Rebol: Rebol
# cannot run on ARM64 and the harness has to work everywhere Red does.
env:
  RED_TARGET: Windows-X86-64
  RED_SYSTEM_TARGET: Windows-X86-64
  RED_SYSTEM_LIBRARY_TARGET: Windows-X86-64-DLL

jobs:
  Core:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red unit tests
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        & build/toolchain/red-console tools/self_hosting/run-red-unit-tests.red
        exit $LASTEXITCODE

  Core-Release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red unit tests in release mode
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -r -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        & build/toolchain/red-console tools/self_hosting/run-red-unit-tests.red
        exit $LASTEXITCODE

  Core-Debug:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red unit tests in debug mode
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -d -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        & build/toolchain/red-console tools/self_hosting/run-red-unit-tests.red
        exit $LASTEXITCODE

  View-Headless:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run headless view/VID test (test GUI backend)
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        & build/toolchain/red-console tools/self_hosting/run-red-view-headless-tests.red
        exit $LASTEXITCODE

  Regression:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red compiler tests
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        & build/toolchain/red-console tools/self_hosting/run-red-compiler-tests.red
        exit $LASTEXITCODE

  Red-System-Test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red/System tests
      shell: pwsh
      env:
        RED_SYSTEM_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_SYSTEM_COMPILER_ARGUMENTS: -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        & build/toolchain/red-console tools/self_hosting/run-red-system-tests.red
        $suite = $LASTEXITCODE
        & build/toolchain/red-console tools/self_hosting/run-red-system-compiler-tests.red
        if ($suite -ne 0) { exit $suite }
        exit $LASTEXITCODE

  Windows-X64-All:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: prepare Windows x86-64 native test dependencies
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # -HybridCompiler makes the canary compile go through the toolchain
        # directly; -Compiler is still resolved, but only the Rebol fallback
        # path would use it.
        & .\tests\run-windows-x64-all-tests.ps1 -Phase Prepare `
          -Compiler build/toolchain/bin/red-toolchain.exe `
          -HybridCompiler build/toolchain/bin/red-toolchain.exe

    - name: run every Red suite
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t Windows-X86-64
        RED_SYSTEM_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_SYSTEM_COMPILER_ARGUMENTS: -t Windows-X86-64
      run: |
        $ErrorActionPreference = 'Stop'
        $runners = @(
          'tools/self_hosting/run-red-unit-tests.red'
          'tools/self_hosting/run-red-system-tests.red'
          'tools/self_hosting/run-red-system-compiler-tests.red'
          'tools/self_hosting/run-red-compiler-tests.red'
          'tools/self_hosting/run-red-view-headless-tests.red'
        )
        $failed = 0
        foreach ($runner in $runners) {
          & build/toolchain/red-console $runner
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::$runner failed with exit code $LASTEXITCODE"
            $failed = 1
          }
        }
        exit $failed

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: windows-x64-all-test-logs
        if-no-files-found: ignore
        path: |
          build/self-hosting/**
