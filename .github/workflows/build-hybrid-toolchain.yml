name: Build hybrid toolchain

# One reusable entry point for every platform the hybrid toolchain targets.
# Each matrix leg runs on its own runner because a bootstrap compiler only runs
# on the platform it was built for; the toolchain it emits can then cross
# compile, but the fixed-point build itself has to be native.
#
# Callers pass the subset they need:
#
#   uses: ./.github/workflows/build-hybrid-toolchain.yml
#   with:
#     platforms: '["windows-x64"]'
#
# and download `seed-<platform>`. Each artifact holds a toolchain archive and
# a CLI console, which together are one generation of the CI seed.
#
# The bootstrap comes from the seed by default. With bootstrap-source=auto a
# platform that has no seed yet falls back to its pinned bootstrap URL, which
# is how the chain is cold started; auto logs loudly when it does, because a
# silent fallback would mix generations.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON array of platforms to build'
        type: string
        default: '["windows-x64","linux-x64","linux-arm64","darwin-arm64"]'
      bootstrap-source:
        description: 'auto | seed | pinned'
        type: string
        default: auto
  workflow_call:
    inputs:
      platforms:
        description: 'JSON array of platforms to build'
        type: string
        default: '["windows-x64","linux-x64","linux-arm64","darwin-arm64"]'
      bootstrap-source:
        description: 'auto | seed | pinned'
        type: string
        default: auto

permissions:
  contents: read
  actions: write

# The group has to include the requested platforms: every caller invokes this
# same workflow, so a group keyed only on the ref would let the Linux job
# cancel the Windows one, and each caller would then lose its toolchain.
concurrency:
  group: build-hybrid-toolchain-${{ inputs.platforms }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    if: ${{ contains(fromJSON(inputs.platforms), matrix.platform) }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: Windows-X86-64
            archive: zip
            bootstrap-path: build/bootstrap/red-bootstrap-speed1.exe
            bootstrap-url: ${{ vars.RED_WINDOWS_X64_HYBRID_BOOTSTRAP_URL }}
            bootstrap-sha256: 53f947164aaeb9912c233a0d7c4fb960ded05932fce809aaf34df75b9f9f7eba
          - platform: darwin-arm64
            runner: macos-15
            target: Darwin-ARM64
            archive: tar
            bootstrap-path: build/bootstrap/red-bootstrap-darwin-arm64
            bootstrap-url: ${{ vars.RED_DARWIN_ARM64_BOOTSTRAP_URL }}
            bootstrap-sha256: 644bfb20fe52dcb054ed9c63324f31b139fd163904730bb78a08b72617ebc81c
          - platform: linux-x64
            runner: ubuntu-24.04
            target: Linux-X86-64
            archive: tar
            bootstrap-path: build/bootstrap/red-bootstrap-linux-x64
            bootstrap-url: ${{ vars.RED_LINUX_X64_HYBRID_BOOTSTRAP_URL }}
            bootstrap-sha256: ${{ vars.RED_LINUX_X64_BOOTSTRAP_SHA256 }}
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: Linux-ARM64
            archive: tar
            bootstrap-path: build/bootstrap/red-bootstrap-linux-arm64
            bootstrap-url: ${{ vars.RED_LINUX_ARM64_HYBRID_BOOTSTRAP_URL }}
            bootstrap-sha256: ${{ vars.RED_LINUX_ARM64_BOOTSTRAP_SHA256 }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Audit CI tooling
      shell: bash
      run: |
        python tools/codegen/sync-codegen-sites.py --check
        python -m unittest discover -s tools/codegen -p test_codegen_sites.py
        python -m unittest discover -s tools/ci -p "test_*.py"

    - name: Fetch the seed bootstrap
      id: seed
      if: inputs.bootstrap-source != 'pinned'
      continue-on-error: true
      uses: ./.github/actions/fetch-seed
      with:
        platform: ${{ matrix.platform }}
        component: toolchain
        output: build/bootstrap/seed-toolchain${{ matrix.archive == 'zip' && '.zip' || '.tar.gz' }}

    - name: Unpack the seed bootstrap (Windows)
      if: steps.seed.outcome == 'success' && matrix.archive == 'zip'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Expand-Archive -Path 'build\bootstrap\seed-toolchain.zip' `
          -DestinationPath 'build\bootstrap\bin'
        # Add-Content, not Out-File: Out-File writes a BOM that can mangle the
        # first key appended to GITHUB_ENV.
        Add-Content -Path $env:GITHUB_ENV -Value 'BOOTSTRAP_PATH=build\bootstrap\bin\red-toolchain.exe'
        echo "bootstrap: seed" >> $env:GITHUB_STEP_SUMMARY

    - name: Unpack the seed bootstrap (Unix)
      if: steps.seed.outcome == 'success' && matrix.archive != 'zip'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/bootstrap/bin
        tar -xzf build/bootstrap/seed-toolchain.tar.gz -C build/bootstrap/bin
        chmod 755 build/bootstrap/bin/red-toolchain
        if [[ "$(uname -s)" == Darwin ]]; then
          xattr -dr com.apple.quarantine build/bootstrap/bin/red-toolchain || true
        fi
        echo "BOOTSTRAP_PATH=build/bootstrap/bin/red-toolchain" >> "$GITHUB_ENV"
        echo "bootstrap: seed" >> "$GITHUB_STEP_SUMMARY"

    - name: Download pinned bootstrap compiler (Windows)
      # Runs when the seed was not requested or is not there yet.
      if: steps.seed.outcome != 'success' && matrix.archive == 'zip'
      shell: pwsh
      env:
        BOOTSTRAP_URL: ${{ matrix.bootstrap-url }}
        BOOTSTRAP_SHA256: ${{ matrix.bootstrap-sha256 }}
        BOOTSTRAP_PATH: ${{ matrix.bootstrap-path }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not $env:BOOTSTRAP_URL) {
          throw "Set the repository variable for the $env:BOOTSTRAP_PATH bootstrap URL."
        }
        if (-not $env:BOOTSTRAP_SHA256) {
          throw 'Set the bootstrap SHA-256 repository variable for this platform.'
        }
        New-Item -ItemType Directory -Force -Path (Split-Path $env:BOOTSTRAP_PATH) | Out-Null
        Invoke-WebRequest -Uri $env:BOOTSTRAP_URL -OutFile $env:BOOTSTRAP_PATH
        $actual = (Get-FileHash -Algorithm SHA256 $env:BOOTSTRAP_PATH).Hash.ToLowerInvariant()
        if ($actual -ne $env:BOOTSTRAP_SHA256) {
          throw "Bootstrap SHA-256 mismatch: $actual"
        }
        Add-Content -Path $env:GITHUB_ENV -Value "BOOTSTRAP_PATH=$env:BOOTSTRAP_PATH"
        echo "bootstrap: pinned $env:BOOTSTRAP_PATH" >> $env:GITHUB_STEP_SUMMARY

    - name: Download pinned bootstrap compiler (Unix)
      if: steps.seed.outcome != 'success' && matrix.archive != 'zip'
      shell: bash
      env:
        BOOTSTRAP_URL: ${{ matrix.bootstrap-url }}
        BOOTSTRAP_SHA256: ${{ matrix.bootstrap-sha256 }}
        BOOTSTRAP_PATH: ${{ matrix.bootstrap-path }}
      run: |
        set -euo pipefail
        if [[ -z "$BOOTSTRAP_URL" ]]; then
          echo "Set the repository variable for the $BOOTSTRAP_PATH bootstrap URL." >&2
          exit 1
        fi
        if [[ -z "$BOOTSTRAP_SHA256" ]]; then
          echo 'Set the bootstrap SHA-256 repository variable for this platform.' >&2
          exit 1
        fi
        mkdir -p "$(dirname "$BOOTSTRAP_PATH")"
        curl --fail --location --retry 3 --retry-all-errors \
          --output "$BOOTSTRAP_PATH" "$BOOTSTRAP_URL"
        echo "$BOOTSTRAP_SHA256  $BOOTSTRAP_PATH" | shasum -a 256 --check
        chmod 755 "$BOOTSTRAP_PATH"
        echo "BOOTSTRAP_PATH=$BOOTSTRAP_PATH" >> "$GITHUB_ENV"
        echo "bootstrap: pinned $BOOTSTRAP_PATH" >> "$GITHUB_STEP_SUMMARY"

    - name: Verify a bootstrap was resolved
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${BOOTSTRAP_PATH:-}" ]]; then
          echo 'No bootstrap compiler. Publish a seed, or run the seed workflow with bootstrap-source=pinned.' >&2
          exit 1
        fi
        echo "bootstrap: $BOOTSTRAP_PATH"

    - name: Build a Red console and drive the fixed point (Windows)
      if: matrix.archive == 'zip'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & $env:BOOTSTRAP_PATH -r -t Windows-X86-64 `
          -o .\build\fixed-point\console.exe environment\console\CLI\console.red
        & .\build\fixed-point\console.exe `
          tools\self_hosting\build-red-toolchain-fixed-point.red `
          --bootstrap $env:BOOTSTRAP_PATH `
          --output-root .\build\fixed-point

    - name: Run the hermetic suite (Windows)
      if: matrix.archive == 'zip'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & .\build\fixed-point\console.exe `
          tools\self_hosting\test-red-toolchain-hermetic.red `
          --toolchain build/fixed-point/h3/red-toolchain.exe

    - name: Build standalone Red toolchain (Unix)
      if: matrix.archive != 'zip'
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        # The build is driven by Red, so the bootstrap first builds the console
        # that runs it.
        "$BOOTSTRAP_PATH" -r -t "$TARGET" \
          -o build/dist/console environment/console/CLI/console.red
        chmod 755 build/dist/console
        ./build/dist/console tools/self_hosting/build-red-toolchain.red \
          --bootstrap "$BOOTSTRAP_PATH" \
          --target "$TARGET" \
          --output build/dist/red-toolchain

    - name: Build the CLI console (Windows)
      if: matrix.archive == 'zip'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force -Path '.\build\packages' | Out-Null
        & .\build\fixed-point\h3\red-toolchain.exe -r -t Windows-X86-64 `
          -o .\build\packages\red-cli-console-windows-x64.exe `
          environment\console\CLI\console.red

    - name: Build the CLI console (Unix)
      if: matrix.archive != 'zip'
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        set -euo pipefail
        mkdir -p build/packages
        ./build/dist/red-toolchain -r -t "$TARGET" \
          -o "build/packages/red-cli-console-$PLATFORM" \
          environment/console/CLI/console.red
        chmod 755 "build/packages/red-cli-console-$PLATFORM"

    - name: Build the GUI console (Darwin)
      # The GUI console is a .app bundle, so it only exists on Darwin. It is
      # built here rather than in a workflow of its own because a bundle that
      # Apple's loader rejects is a broken generation, not a broken extra.
      if: matrix.platform == 'darwin-arm64'
      shell: bash
      run: |
        set -euo pipefail
        ./build/dist/red-toolchain -r -t macOS-ARM64 \
          -o build/dist/gui-console \
          environment/console/GUI/gui-console.red
        chmod 755 build/dist/gui-console.app/Contents/MacOS/gui-console

    - name: Validate Apple ARM64 outputs (Darwin)
      if: matrix.platform == 'darwin-arm64'
      shell: bash
      run: |
        set -euo pipefail
        gui=build/dist/gui-console.app/Contents/MacOS/gui-console
        test -x "$gui"
        test -f build/dist/gui-console.app/Contents/Info.plist

        for binary in build/dist/red-toolchain build/dist/cli-console "$gui"; do
          file "$binary" | grep -q 'Mach-O 64-bit.*arm64'
          otool -hv "$binary" | grep -q ARM64
          otool -l "$binary" | grep -q LC_CODE_SIGNATURE
          dyld_info -validate_only "$binary"
        done
        otool -L "$gui" | grep -q AppKit.framework

        # The bundle signature covers the bundle; verifying a bare copy is what
        # checks the executable's own signature.
        cp "$gui" build/dist/gui-console.signature-probe
        chmod 755 build/dist/gui-console.signature-probe
        codesign --verify --strict --verbose=4 build/dist/gui-console.signature-probe
        rm build/dist/gui-console.signature-probe

    - name: Package toolchain (Windows)
      if: matrix.archive == 'zip'
      shell: pwsh
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        $ErrorActionPreference = 'Stop'
        $compiler = '.\build\fixed-point\h3\red-toolchain.exe'
        # Staged outside build\packages so the artifact is not uploaded twice.
        $package = ".\build\stage\red-toolchain-$env:PLATFORM"
        New-Item -ItemType Directory -Force -Path $package,'.\build\packages' | Out-Null
        Copy-Item -LiteralPath $compiler -Destination $package
        & $compiler --toolchain-info |
          Set-Content -LiteralPath (Join-Path $package 'TOOLCHAIN-INFO.txt') -Encoding utf8NoBOM
        & $compiler --resource-manifest |
          Set-Content -LiteralPath (Join-Path $package 'RESOURCE-MANIFEST.txt') -Encoding ascii
        Compress-Archive -Path "$package\*" `
          -DestinationPath ".\build\packages\red-toolchain-$env:PLATFORM.zip"
        $console = ".\build\packages\red-cli-console-$env:PLATFORM.exe"
        @(
          "$((Get-FileHash -Algorithm SHA256 ".\build\packages\red-toolchain-$env:PLATFORM.zip").Hash.ToLowerInvariant())  red-toolchain-$env:PLATFORM.zip"
          "$((Get-FileHash -Algorithm SHA256 $console).Hash.ToLowerInvariant())  red-cli-console-$env:PLATFORM.exe"
        ) | Set-Content -LiteralPath '.\build\packages\SHA256SUMS' -Encoding ascii

    - name: Package toolchain (Unix)
      if: matrix.archive != 'zip'
      shell: bash
      env:
        PLATFORM: ${{ matrix.platform }}
      run: |
        set -euo pipefail
        mkdir -p build/packages
        test -x build/dist/red-toolchain
        COPYFILE_DISABLE=1 tar -czf "build/packages/red-toolchain-$PLATFORM.tar.gz" \
          -C build/dist red-toolchain
        if [[ -d build/dist/gui-console.app ]]; then
          COPYFILE_DISABLE=1 tar -czf "build/packages/red-gui-console-$PLATFORM.tar.gz" \
            -C build/dist gui-console.app
        fi
        cd build/packages
        sums=()
        for candidate in \
          "red-toolchain-$PLATFORM.tar.gz" \
          "red-cli-console-$PLATFORM" \
          "red-gui-console-$PLATFORM.tar.gz"
        do
          if [[ -f "$candidate" ]]; then
            sums+=("$candidate")
          fi
        done
        shasum -a 256 "${sums[@]}" > SHA256SUMS

    - name: Upload seed
      uses: actions/upload-artifact@v7
      with:
        name: seed-${{ matrix.platform }}
        path: build/packages/
        if-no-files-found: error
        retention-days: 14
