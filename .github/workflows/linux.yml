name: Linux-x86-64

# The Linux x86-64 suites. build-toolchain.yml calls this after the `build` job
# of that run, so the toolchain the suites compile with is the one built from
# the same sources they test. A run that built no toolchain has nothing to test
# with, which is why there is no push trigger here.
#
# A manual run is the convenience path, not the gate: a dispatched run builds
# nothing either, so it takes one published seed generation instead. That is
# what the `source` fallback in the job below says -- a caller passes `build`,
# a human passes nothing and gets `seed`.

on:
  workflow_call:
    inputs:
      source:
        description: 'toolchain to test with: build (this run) | seed (a published generation)'
        type: string
        required: false
        default: build
  workflow_dispatch:
    inputs:
      seed-tag:
        description: 'release that holds MANIFEST.json'
        type: string
        required: false
        default: ci-seed

permissions:
  contents: read
  actions: write

env:
  RED_TARGET: Linux-X86-64
  RED_SYSTEM_TARGET: Linux-X86-64

jobs:
  Linux-X64-All:
    runs-on: ubuntu-24.04
    name: Run Linux x86-64 Tests
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Linux x86-64 test dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils ca-certificates curl file gawk gcc libc6:i386 libc6-dev \
          libcurl4t64 libgtk-3-0t64

    - uses: ./.github/actions/setup-red-harness
      with:
        platform: linux-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}

    - name: run every Red suite
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain
        RED_COMPILER_ARGUMENTS: -t Linux-X86-64
        RED_SYSTEM_COMPILER: build/toolchain/bin/red-toolchain
        RED_SYSTEM_COMPILER_ARGUMENTS: -t Linux-X86-64
      run: |
        set -euo pipefail
        failed=0
        for runner in \
          tools/self_hosting/run-red-unit-tests.red \
          tools/self_hosting/run-red-system-tests.red \
          tools/self_hosting/run-red-system-compiler-tests.red \
          tools/self_hosting/run-red-compiler-tests.red \
          tools/self_hosting/run-red-view-headless-tests.red
        do
          if ! build/toolchain/red-console "$runner"; then
            echo "::error::$runner failed"
            failed=1
          fi
        done
        exit "$failed"

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Linux-x64-all-test-logs
        if-no-files-found: ignore
        path: |
          build/self-hosting/**
