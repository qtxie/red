name: macOS ARM64

on: [push, pull_request]

permissions:
  contents: read
  actions: write

# Everything runs natively on Apple Silicon. The old job cross-built the tests
# on Windows with Rebol and shipped them over as an artifact; the toolchain is
# built here and the suites are driven here.
env:
  RED_TARGET: Darwin-ARM64
  RED_SYSTEM_TARGET: Darwin-ARM64

jobs:
  Run-macOS-ARM64-Tests:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Verify native Apple Silicon runner
      run: test "$(uname -m)" = arm64

    - uses: ./.github/actions/setup-red-harness
      with:
        platform: darwin-arm64

    - name: run every Red suite
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain
        RED_COMPILER_ARGUMENTS: -t Darwin-ARM64
        RED_SYSTEM_COMPILER: build/toolchain/bin/red-toolchain
        RED_SYSTEM_COMPILER_ARGUMENTS: -t Darwin-ARM64
      run: |
        set -euo pipefail
        failed=0
        for runner in \
          tools/self_hosting/run-red-unit-tests.red \
          tools/self_hosting/run-red-system-tests.red \
          tools/self_hosting/run-red-system-compiler-tests.red \
          tools/self_hosting/run-red-compiler-tests.red \
          tools/self_hosting/run-red-view-headless-tests.red
        do
          if ! build/toolchain/red-console "$runner"; then
            echo "::error::$runner failed"
            failed=1
          fi
        done
        exit "$failed"

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: macos-arm64-test-logs
        if-no-files-found: ignore
        path: |
          build/self-hosting/**

  macOS-ARM64-View-Smoke:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - uses: ./.github/actions/setup-red-harness
      with:
        platform: darwin-arm64

    - name: Build macOS ARM64 View smoke
      run: |
        set -euo pipefail
        mkdir -p build/macos-arm64-view-tests
        build/toolchain/bin/red-toolchain -r -t macOS-ARM64 \
          -o build/macos-arm64-view-tests/macos-arm64-view-smoke \
          tests/source/view/macos-arm64-smoke.red

    - name: Run macOS ARM64 native View smoke
      working-directory: build/macos-arm64-view-tests
      run: |
        set -eu
        app=macos-arm64-view-smoke.app
        exe="$app/Contents/MacOS/macos-arm64-view-smoke"
        chmod 755 "$exe"
        file "$exe" | grep -q 'Mach-O 64-bit executable arm64'
        otool -hv "$exe" | grep -q ARM64
        otool -L "$exe" | grep -q 'AppKit.framework'
        dyld_info -validate_only "$exe"
        cp "$exe" macos-arm64-view-smoke.signature-probe
        chmod 755 macos-arm64-view-smoke.signature-probe
        codesign --verify --strict --verbose=4 macos-arm64-view-smoke.signature-probe
        rm macos-arm64-view-smoke.signature-probe
        rm -f macos-arm64-view-smoke.ok macos-arm64-view-smoke.error
        if ./$exe; then
          :
        else
          status=$?
          test ! -f macos-arm64-view-smoke.error || cat macos-arm64-view-smoke.error
          exit "$status"
        fi
        test "$(cat macos-arm64-view-smoke.ok)" = MACOS-ARM64-VIEW-OK

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: macos-arm64-view-smoke
        if-no-files-found: ignore
        path: |
          build/macos-arm64-view-tests/**
