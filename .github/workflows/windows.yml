name: Windows

# The Windows suites. build-toolchain.yml calls this after the `build` job of
# that run, so the toolchain the suites compile with is the one built from the
# same sources they test. A run that built no toolchain has nothing to test
# with, which is why there is no push trigger here.
#
# A manual run is the convenience path, not the gate: a dispatched run builds
# nothing either, so it takes one published seed generation instead. That is
# what the `source` fallback in each job below says -- a caller passes `build`,
# a human passes nothing and gets `seed`.

on:
  workflow_call:
    inputs:
      source:
        description: 'toolchain to test with: build (this run) | seed (a published generation)'
        type: string
        required: false
        default: build
  workflow_dispatch:
    inputs:
      seed-tag:
        description: 'release that holds MANIFEST.json'
        type: string
        required: false
        default: ci-seed

permissions:
  contents: read
  actions: write

# The suites are driven by Red runners, so nothing here needs Rebol: Rebol
# cannot run on ARM64 and the harness has to work everywhere Red does.
#
# MSDOS-X86-64 is the Windows console target; Windows-X86-64 names the GUI
# sub-system, which every suite program here would fail to be (a Red one is
# rejected outright for not carrying `Needs: View`, and a compiled binary that
# did link would print into a console Windows never gave it). Only the shared
# library keeps the GUI spelling, because that is the registry's name for it.
env:
  RED_TARGET: MSDOS-X86-64
  RED_SYSTEM_TARGET: MSDOS-X86-64
  RED_SYSTEM_LIBRARY_TARGET: Windows-X86-64-DLL

jobs:
  Core:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red unit tests
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t MSDOS-X86-64
      run: tools/ci/run-suite.ps1 tools/self_hosting/run-red-unit-tests.red

  Core-Release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red unit tests in release mode
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -r -t MSDOS-X86-64
      run: tools/ci/run-suite.ps1 tools/self_hosting/run-red-unit-tests.red

  Core-Debug:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red unit tests in debug mode
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -d -t MSDOS-X86-64
      run: tools/ci/run-suite.ps1 tools/self_hosting/run-red-unit-tests.red

  View-Headless:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run headless view/VID test (test GUI backend)
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t MSDOS-X86-64
      run: tools/ci/run-suite.ps1 tools/self_hosting/run-red-view-headless-tests.red

  Regression:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red compiler tests
      shell: pwsh
      env:
        RED_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_COMPILER_ARGUMENTS: -t MSDOS-X86-64
      run: tools/ci/run-suite.ps1 tools/self_hosting/run-red-compiler-tests.red

  Red-System-Test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run Red/System tests
      shell: pwsh
      env:
        RED_SYSTEM_COMPILER: build/toolchain/bin/red-toolchain.exe
        RED_SYSTEM_COMPILER_ARGUMENTS: -t MSDOS-X86-64
      run: |
        tools/ci/run-suite.ps1 `
          tools/self_hosting/run-red-system-tests.red `
          tools/self_hosting/run-red-system-compiler-tests.red

  # The native counterpart of View-Headless: the headless backend checks the
  # engine's logic through a stub, and this one drives the Win32 backend for
  # real -- registers a window class, opens a window, measures text through
  # GDI+, and runs the whole `base-self-test` suite against it. Nothing else
  # here reaches `modules/view/backends/windows`.
  #
  # It takes the toolchain directly (-HybridCompiler) rather than red.r under
  # Rebol, so it needs none of the dependencies the all-tests Prepare phase
  # builds: the driver compiles and checks both programs itself.
  View-Native:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup-red-harness
      with:
        platform: windows-x64
        source: ${{ inputs.source || 'seed' }}
        seed-tag: ${{ inputs.seed-tag || 'ci-seed' }}
    - name: run the native Windows x86-64 View suite
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & .\tests\run-windows-x64-view-tests.ps1 `
          -HybridCompiler build/toolchain/bin/red-toolchain.exe `
          -KeepArtifactsOnFailure

    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: windows-x64-view-logs
        if-no-files-found: ignore
        path: |
          build/windows-x64-view-tests/**
