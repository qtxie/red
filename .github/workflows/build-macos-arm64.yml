name: Build macOS ARM64 binaries

# The only workflow that builds the macOS GUI console and the only one that
# checks an output the way Apple does: LC_CODE_SIGNATURE present,
# dyld_info -validate_only clean, codesign --verify --strict passing, AppKit
# linked. Getting a non-Windows gui-console to run at all was recent and hard,
# so this stays even though the seed covers the toolchain itself.
#
# It takes its toolchain from the seed rather than rebuilding one. Building a
# toolchain per push is build-toolchain.yml's job; this only has to answer
# whether the console sources still produce a loadable .app.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Verify native Apple Silicon runner
      shell: bash
      run: |
        set -euo pipefail
        test "$(uname -m)" = arm64

    - name: Fetch the seed toolchain
      uses: ./.github/actions/fetch-seed
      with:
        platform: darwin-arm64
        component: toolchain
        output: build/toolchain/seed-toolchain.tar.gz

    - name: Unpack the seed toolchain
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/toolchain/bin
        tar -xzf build/toolchain/seed-toolchain.tar.gz -C build/toolchain/bin
        chmod 755 build/toolchain/bin/red-toolchain
        xattr -dr com.apple.quarantine build/toolchain/bin/red-toolchain || true
        file build/toolchain/bin/red-toolchain | grep -q 'Mach-O 64-bit.*arm64'

    - name: Build GUI and CLI consoles
      shell: bash
      run: |
        set -euo pipefail
        compiler=build/toolchain/bin/red-toolchain
        "$compiler" -r -t macOS-ARM64 \
          -o build/dist/gui-console \
          environment/console/GUI/gui-console.red
        "$compiler" -r -t Darwin-ARM64 \
          -o build/dist/cli-console \
          environment/console/CLI/console.red
        chmod 755 \
          build/dist/cli-console \
          build/dist/gui-console.app/Contents/MacOS/gui-console

    - name: Validate ARM64 outputs
      shell: bash
      run: |
        set -euo pipefail
        gui=build/dist/gui-console.app/Contents/MacOS/gui-console
        test -x build/toolchain/bin/red-toolchain
        test -x build/dist/cli-console
        test -x "$gui"
        test -f build/dist/gui-console.app/Contents/Info.plist

        build/toolchain/bin/red-toolchain --self-check
        for binary in build/toolchain/bin/red-toolchain build/dist/cli-console "$gui"; do
          file "$binary" | grep -q 'Mach-O 64-bit.*arm64'
          otool -hv "$binary" | grep -q ARM64
          otool -l "$binary" | grep -q LC_CODE_SIGNATURE
          dyld_info -validate_only "$binary"
        done
        otool -L "$gui" | grep -q AppKit.framework

    - name: Package binaries
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/packages
        COPYFILE_DISABLE=1 tar -czf build/packages/gui-console-macos-arm64.tar.gz \
          -C build/dist gui-console.app
        COPYFILE_DISABLE=1 tar -czf build/packages/cli-console-darwin-arm64.tar.gz \
          -C build/dist cli-console
        cd build/packages
        shasum -a 256 *.tar.gz > SHA256SUMS

    - name: Upload macOS ARM64 binaries
      uses: actions/upload-artifact@v7
      with:
        name: red-macos-arm64-binaries
        path: build/packages/
        if-no-files-found: error
        retention-days: 14
